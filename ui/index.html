<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arclens</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
    .answer-text { white-space: pre-wrap; line-height: 1.8; }
    @keyframes shimmer { 0%,100%{opacity:1} 50%{opacity:.45} }
    .skeleton { animation: shimmer 1.4s ease-in-out infinite; background:#f1f5f9; border-radius:6px; }
  </style>
</head>
<body class="h-full bg-gray-50 font-sans antialiased" x-data="ragApp()" x-cloak @keydown.escape.window="activeVideo = null">

<!-- ══ Video modal ══════════════════════════════════════════════════════ -->
<div
  x-show="activeVideo"
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100"
  x-transition:leave="transition ease-in duration-150"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
  @click.self="activeVideo = null"
  class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4"
>
  <div class="bg-white rounded-2xl shadow-2xl overflow-hidden w-full max-w-4xl flex flex-col">
    <!-- Modal header -->
    <div class="flex items-center justify-between px-5 py-3 border-b border-gray-100 flex-shrink-0">
      <div class="min-w-0">
        <p class="text-sm font-semibold text-gray-800 truncate" x-text="activeVideo?.title"></p>
        <p class="text-xs text-gray-400" x-text="activeVideo?.channel"></p>
      </div>
      <div class="flex items-center gap-3 flex-shrink-0 ml-4">
        <span class="text-xs font-mono text-brand-600 bg-brand-50 px-2 py-0.5 rounded-full"
              x-text="activeVideo ? 'Starting at ' + formatTime(activeVideo.timestamp_seconds) : ''"></span>
        <button @click="activeVideo = null"
                class="w-7 h-7 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center transition text-gray-500">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- YouTube iframe — recreated each open via x-if so autoplay resets correctly -->
    <div class="relative w-full bg-black" style="padding-bottom:56.25%">
      <template x-if="activeVideo">
        <iframe
          :src="`https://www.youtube.com/embed/${activeVideo.video_id}?start=${activeVideo.timestamp_seconds}&autoplay=1&rel=0&modestbranding=1`"
          class="absolute inset-0 w-full h-full"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
        ></iframe>
      </template>
    </div>

    <!-- Modal footer -->
    <div class="px-5 py-3 flex items-center justify-between border-t border-gray-100 flex-shrink-0">
      <p class="text-xs text-gray-400">Press <kbd class="bg-gray-100 px-1.5 py-0.5 rounded text-xs font-mono">Esc</kbd> to close</p>
      <a :href="ytLink(activeVideo?.video_id, activeVideo?.timestamp_seconds)"
         target="_blank" rel="noopener noreferrer"
         class="text-xs text-brand-600 hover:text-brand-700 flex items-center gap-1">
        Open in YouTube
        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"/><path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z"/></svg>
      </a>
    </div>
  </div>
</div>

<div class="flex h-screen overflow-hidden">

  <!-- ══════════════ SIDEBAR ══════════════ -->
  <aside class="w-60 flex-shrink-0 bg-white border-r border-gray-200 flex flex-col overflow-hidden">

    <!-- Logo -->
    <div class="px-5 py-4 border-b border-gray-100 flex items-center">
      <img src="logo.png" alt="Arclens" class="h-7 w-auto" />
    </div>

    <!-- Nav -->
    <nav class="px-3 py-3 space-y-0.5 border-b border-gray-100">
      <button
        class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition"
        @click="view = 'home'"
        :class="view === 'home' ? 'bg-brand-50 text-brand-700' : ''"
      >
        <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Home
      </button>
    </nav>

    <!-- Library -->
    <div class="flex-1 overflow-y-auto scrollbar-thin">
      <div class="px-5 pt-4 pb-2">
        <p class="text-[10px] font-semibold uppercase tracking-widest text-gray-400">Library</p>
      </div>

      <!-- Ingested playlists list -->
      <div class="px-3 space-y-0.5 pb-3">
        <template x-if="playlists.length === 0">
          <p class="px-3 py-2 text-xs text-gray-400 italic">No playlists ingested yet.</p>
        </template>
        <template x-for="pl in playlists" :key="pl.playlist_id">
          <button
            @click="selectPlaylist(pl)"
            class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-gray-700 hover:bg-gray-50 transition text-left group"
            :class="playlistId === pl.playlist_id ? 'bg-brand-50 text-brand-700 font-medium' : ''"
          >
            <svg class="w-4 h-4 flex-shrink-0 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.069A1 1 0 0121 8.867v6.266a1 1 0 01-1.447.902L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            <div class="min-w-0 flex-1">
              <p class="truncate text-xs font-medium leading-tight"
                 x-text="pl.playlist_title && pl.playlist_title !== pl.playlist_id ? pl.playlist_title : pl.playlist_id"></p>
              <p class="text-[10px] text-gray-400 truncate" x-text="formatDate(pl.last_ingested)"></p>
            </div>
            <svg x-show="playlistId === pl.playlist_id" class="w-3.5 h-3.5 text-brand-600 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
            </svg>
          </button>
        </template>
      </div>
    </div>

    <!-- Ingest accordion -->
    <div class="border-t border-gray-100">
      <button
        @click="ingestOpen = !ingestOpen"
        class="w-full flex items-center justify-between px-5 py-3 text-xs font-semibold uppercase tracking-widest text-gray-500 hover:text-gray-700 transition"
      >
        <span>Add Playlist</span>
        <svg class="w-3.5 h-3.5 transition-transform" :class="ingestOpen ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

      <div x-show="ingestOpen" x-transition class="px-4 pb-4 space-y-3">
        <div>
          <label class="text-xs text-gray-500 mb-1 block">Playlist URL</label>
          <input
            type="text"
            x-model="playlistUrl"
            placeholder="https://youtube.com/playlist?list=..."
            class="w-full text-xs rounded-lg px-3 py-2 border border-gray-200 bg-gray-50 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white"
          />
        </div>
        <div>
          <label class="text-xs text-gray-500 mb-1 block">User ID</label>
          <input
            type="text"
            x-model="userId"
            placeholder="e.g. santosh244ster"
            class="w-full text-xs rounded-lg px-3 py-2 border border-gray-200 bg-gray-50 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white"
          />
        </div>
        <button
          @click="ingest()"
          :disabled="ingestStatus === 'loading' || !playlistUrl.trim()"
          class="w-full py-2 rounded-lg text-xs font-semibold bg-brand-600 hover:bg-brand-700 disabled:opacity-50 disabled:cursor-not-allowed text-white transition"
        >
          <span x-show="ingestStatus !== 'loading'">Ingest Playlist</span>
          <span x-show="ingestStatus === 'loading'">Ingesting…</span>
        </button>
        <div x-show="ingestStatus === 'done'" class="flex items-center gap-1.5 text-xs text-brand-600">
          <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
          Ingestion started
        </div>
        <div x-show="ingestStatus === 'error'" class="text-xs text-red-500" x-text="ingestError"></div>
      </div>
    </div>

  </aside>

  <!-- ══════════════ MAIN CONTENT ══════════════ -->
  <div class="flex-1 flex flex-col overflow-hidden">

    <!-- Top bar -->
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center gap-3 flex-shrink-0">
      <div class="flex-1 relative">
        <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input
          type="text"
          x-model="question"
          @keydown.enter="ask()"
          placeholder="Ask a question about the playlist…"
          class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition"
        />
      </div>
      <!-- Playlist badge (shows active playlist + user) -->
      <div x-show="playlistId" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-brand-50 border border-brand-100 text-xs text-brand-700 font-medium flex-shrink-0 max-w-[200px]">
        <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.069A1 1 0 0121 8.867v6.266a1 1 0 01-1.447.902L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
        </svg>
        <span class="truncate" x-text="playlistId"></span>
        <span x-show="userId" class="text-brand-400 flex-shrink-0">·</span>
        <span x-show="userId" class="truncate text-brand-500 font-normal" x-text="userId"></span>
      </div>
      <button
        @click="ask()"
        :disabled="chatStatus === 'loading' || !question.trim() || !playlistId.trim()"
        class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-semibold transition flex-shrink-0"
      >
        <span x-show="chatStatus !== 'loading'">Ask</span>
        <span x-show="chatStatus === 'loading'" class="flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/></svg>
          Thinking…
        </span>
      </button>
    </header>

    <!-- Body -->
    <div class="flex-1 flex overflow-hidden">

      <!-- Center: clip cards -->
      <main class="flex-1 overflow-y-auto scrollbar-thin px-6 py-6 space-y-5">

        <!-- Question heading -->
        <div x-show="currentQuestion">
          <p class="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-1.5">Question</p>
          <h1 class="text-2xl font-semibold text-gray-900 leading-snug" x-text="currentQuestion"></h1>
        </div>

        <!-- Error banner -->
        <div x-show="chatStatus === 'error'" class="px-4 py-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm" x-text="errorMsg"></div>

        <!-- Refusal banner -->
        <div x-show="refusalReason" class="px-4 py-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-sm">
          <span class="font-semibold">No grounded answer found — </span><span x-text="refusalReason"></span>
        </div>

        <!-- Skeleton -->
        <div x-show="chatStatus === 'loading'" class="space-y-4">
          <template x-for="i in 3" :key="i">
            <div class="flex gap-4 p-4 rounded-2xl border border-gray-100 bg-white shadow-sm">
              <div class="skeleton w-44 h-26 flex-shrink-0 rounded-xl" style="height:6.5rem"></div>
              <div class="flex-1 space-y-2.5 py-1">
                <div class="skeleton h-3 w-16 rounded-full"></div>
                <div class="skeleton h-4 w-3/4"></div>
                <div class="skeleton h-3 w-1/3"></div>
                <div class="skeleton h-3 w-full"></div>
                <div class="skeleton h-3 w-5/6"></div>
              </div>
            </div>
          </template>
        </div>

        <!-- Clip cards (one per citation) -->
        <div x-show="chatStatus === 'done' && citations.length > 0" class="space-y-3">
          <p class="text-xs font-semibold uppercase tracking-widest text-gray-400">Sources</p>
          <template x-for="(c, idx) in citations" :key="idx">
            <div
              @click="c.video_id && openVideo(c)"
              :class="c.video_id ? 'cursor-pointer' : 'cursor-default'"
              class="flex gap-4 p-4 rounded-2xl border border-gray-100 bg-white shadow-sm hover:shadow-md hover:border-brand-100 transition-all group"
            >
              <!-- Thumbnail -->
              <div class="relative flex-shrink-0 w-44 rounded-xl overflow-hidden bg-gray-100" style="height:6.5rem">
                <img
                  x-show="c.video_id"
                  :src="ytThumb(c.video_id)"
                  :alt="c.title"
                  class="w-full h-full object-cover"
                  @error="$el.style.display='none'"
                />
                <div class="absolute inset-0 flex items-center justify-center bg-black/25 group-hover:bg-black/35 transition">
                  <div class="w-9 h-9 rounded-full bg-white/95 flex items-center justify-center shadow-sm">
                    <svg class="w-4 h-4 text-gray-800 ml-0.5" fill="currentColor" viewBox="0 0 20 20">
                      <path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/>
                    </svg>
                  </div>
                </div>
              </div>

              <!-- Info -->
              <div class="flex-1 min-w-0 py-0.5">
                <div class="flex items-start justify-between gap-2 mb-1.5">
                  <span class="inline-flex items-center gap-1 text-[10px] font-bold uppercase tracking-wide text-brand-700 bg-brand-50 px-2 py-0.5 rounded-full">
                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z"/></svg>
                    Video
                  </span>
                  <span class="text-xs text-gray-400 font-mono flex-shrink-0" x-text="formatTime(c.timestamp_seconds)"></span>
                </div>
                <p class="text-sm font-semibold text-gray-800 leading-snug mb-1 line-clamp-2" x-text="c.title"></p>
                <p class="text-xs text-gray-500" x-text="c.channel"></p>
                <p class="mt-2 text-xs text-brand-600 group-hover:text-brand-700 font-medium">
                  Jump to <span x-text="formatTime(c.timestamp_seconds)"></span> →
                </p>
              </div>
            </div>
          </template>
        </div>

        <!-- Empty / idle -->
        <div x-show="chatStatus === 'idle'" class="flex flex-col items-center justify-center h-72 text-gray-300 gap-3">
          <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.069A1 1 0 0121 8.867v6.266a1 1 0 01-1.447.902L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
          </svg>
          <p class="text-sm">Select a playlist from the sidebar and ask a question</p>
        </div>

        <!-- No playlist selected warning -->
        <div x-show="chatStatus === 'idle' && !playlistId" class="mt-2 text-center">
          <p class="text-xs text-amber-500">← Select an ingested playlist from the Library, or add a new one</p>
        </div>

      </main>

      <!-- Right: answer panel -->
      <aside class="w-96 flex-shrink-0 border-l border-gray-200 bg-white flex flex-col overflow-hidden">

        <div class="px-5 py-4 border-b border-gray-100 flex items-center gap-2">
          <svg class="w-4 h-4 text-brand-600" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M5 2a1 1 0 011 1v1h1a1 1 0 010 2H6v1a1 1 0 01-2 0V6H3a1 1 0 010-2h1V3a1 1 0 011-1zm0 10a1 1 0 011 1v1h1a1 1 0 110 2H6v1a1 1 0 11-2 0v-1H3a1 1 0 110-2h1v-1a1 1 0 011-1zM12 2a1 1 0 01.967.744L14.146 7.2 17.5 9.134a1 1 0 010 1.732l-3.354 1.935-1.18 4.455a1 1 0 01-1.933 0L9.854 12.8 6.5 10.866a1 1 0 010-1.732l3.354-1.935 1.18-4.455A1 1 0 0112 2z" clip-rule="evenodd"/>
          </svg>
          <span class="text-sm font-semibold text-gray-700">Answer</span>
        </div>

        <div class="flex-1 overflow-y-auto scrollbar-thin px-5 py-5">

          <!-- Skeleton -->
          <div x-show="chatStatus === 'loading'" class="space-y-2.5">
            <div class="skeleton h-3 w-full"></div>
            <div class="skeleton h-3 w-5/6"></div>
            <div class="skeleton h-3 w-4/5"></div>
            <div class="skeleton h-3 w-full"></div>
            <div class="skeleton h-3 w-11/12"></div>
            <div class="skeleton h-3 w-3/4"></div>
          </div>

          <!-- Answer -->
          <div x-show="chatStatus === 'done' && answer && !refusalReason">
            <!-- Teal left-border accent block -->
            <div class="border-l-4 border-brand-500 pl-4 mb-5">
              <p class="answer-text text-sm text-gray-700 leading-relaxed" x-text="answer"></p>
            </div>

            <!-- Sources table -->
            <div x-show="citations.length > 0">
              <p class="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-3">Sources</p>
              <div class="space-y-2">
                <template x-for="(c, idx) in citations" :key="idx">
                  <div class="flex items-start gap-2.5 py-2 border-b border-gray-50 last:border-0">
                    <span class="flex-shrink-0 w-5 h-5 rounded-full bg-gray-100 text-gray-500 text-xs font-bold flex items-center justify-center mt-0.5" x-text="idx + 1"></span>
                    <div class="flex-1 min-w-0">
                      <p class="text-xs font-medium text-gray-800 leading-snug" x-text="c.title"></p>
                      <div class="flex items-center gap-2 mt-0.5 flex-wrap">
                        <span class="text-[11px] text-gray-400" x-text="c.channel"></span>
                        <span class="text-gray-200">·</span>
                        <!-- timestamp: clickable when video_id present, plain text otherwise -->
                        <button
                          x-show="c.video_id"
                          @click="openVideo(c)"
                          class="text-[11px] font-mono text-brand-600 hover:text-brand-700 flex items-center gap-0.5 cursor-pointer"
                        >
                          <span x-text="formatTime(c.timestamp_seconds)"></span>
                          <svg class="w-2.5 h-2.5" fill="currentColor" viewBox="0 0 20 20"><path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"/><path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z"/></svg>
                        </button>
                        <span
                          x-show="!c.video_id"
                          class="text-[11px] font-mono text-gray-400"
                          x-text="formatTime(c.timestamp_seconds)"
                        ></span>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <!-- Idle placeholder -->
          <div x-show="chatStatus === 'idle'" class="flex flex-col items-center justify-center h-52 text-gray-300 gap-2">
            <svg class="w-9 h-9" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
            </svg>
            <p class="text-xs">Answer will appear here</p>
          </div>

        </div>
      </aside>

    </div>
  </div>
</div>

<script>
function ragApp() {
  return {
    // Video modal
    activeVideo: null,

    // Sidebar state
    ingestOpen: false,
    playlists: [],   // [{playlist_id, user_id, last_ingested, status}]

    // Ingest form
    playlistUrl: '',
    userId: '',
    ingestStatus: 'idle',
    ingestError: '',

    // Chat
    playlistId: '',
    question: '',
    currentQuestion: '',
    answer: '',
    citations: [],
    refusalReason: '',
    chatStatus: 'idle',
    errorMsg: '',

    view: 'home',

    async init() {
      // Auto-extract playlist ID (and matching userId) when URL changes
      this.$watch('playlistUrl', (url) => {
        try {
          const u = new URL(url);
          const list = u.searchParams.get('list');
          if (list) {
            this.playlistId = list;
            // Look up the stored user_id for this playlist so the namespace matches
            const stored = this.playlists.find(p => p.playlist_id === list);
            if (stored?.user_id) this.userId = stored.user_id;
          }
        } catch (_) {}
      });
      await this.loadPlaylists();
    },

    async loadPlaylists() {
      try {
        const res = await fetch('/playlists');
        if (res.ok) this.playlists = await res.json();
      } catch (_) {}
    },

    selectPlaylist(pl) {
      this.playlistId = pl.playlist_id;
      if (pl.user_id) this.userId = pl.user_id;
    },

    async ingest() {
      if (!this.playlistUrl.trim()) return;
      this.ingestStatus = 'loading';
      this.ingestError = '';
      try {
        const res = await fetch('/ingest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            playlist_url: this.playlistUrl.trim(),
            user_id: this.userId.trim() || 'default',
          }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        this.ingestStatus = 'done';
        // Refresh library after a short delay so background task has time to write meta
        setTimeout(() => this.loadPlaylists(), 3000);
      } catch (err) {
        this.ingestStatus = 'error';
        this.ingestError = err.message || 'Ingest failed';
      }
    },

    async ask() {
      if (!this.question.trim() || !this.playlistId.trim()) return;
      this.chatStatus = 'loading';
      this.errorMsg = '';
      this.refusalReason = '';
      this.answer = '';
      this.citations = [];
      this.currentQuestion = this.question.trim();

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            question: this.question.trim(),
            playlist_id: this.playlistId.trim(),
            user_id: this.userId.trim() || 'default',
          }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
        const data = await res.json();

        if (data.refusal) {
          this.refusalReason = data.reason || 'Insufficient context.';
          this.chatStatus = 'done';
          return;
        }

        this.answer = data.answer || '';
        this.citations = data.citations || [];
        this.chatStatus = 'done';
      } catch (err) {
        this.chatStatus = 'error';
        this.errorMsg = err.message || 'Request failed';
      }
    },

    openVideo(citation) {
      this.activeVideo = citation;
    },

    ytThumb(videoId) {
      return `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
    },

    ytLink(videoId, ts) {
      if (!videoId) return null;
      return `https://www.youtube.com/watch?v=${videoId}&t=${Math.max(0, ts)}s`;
    },

    formatTime(secs) {
      secs = Math.max(0, Math.floor(secs));
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      const s = secs % 60;
      if (h > 0) {
        return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }
      return `${m}:${String(s).padStart(2, '0')}`;
    },

    formatDate(iso) {
      if (!iso) return '';
      try {
        return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      } catch (_) { return iso; }
    },
  };
}
</script>
</body>
</html>
