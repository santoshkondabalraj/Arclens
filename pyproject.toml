[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # LangChain core primitives
    "langchain>=1.0.0",
    "langchain-classic>=0.1.0",
    "langchain-core>=1.0.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0.0",
    # LangGraph + LangSmith
    "langgraph>=0.4.0",
    "langsmith>=0.2.0",

    # Google Generative AI SDK
    "google-generativeai>=0.8.0",

    # Pinecone SDK (vectorstore via langchain-community)
    "pinecone>=5.0.0",

    # YouTube transcript fetching
    "youtube-transcript-api>=0.6.0",
    "pytubefix>=9.0.0",

    # Cross-encoder reranking
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",

    # BM25
    "rank-bm25>=0.2.2",

    # FastAPI + serving
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yt_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
